{% extends "login_base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<!-- Tarjeta única con todo integrado -->
<div class="login-card">
    <!-- Header con logo del estudio -->
    <div class="login-card-header">
        <span class="scales-icon">⚖️</span>
        <h1 class="studio-name">QUIJANDRIA ABOGADOS</h1>
        <div class="studio-subtitle">Sistema de Gestión de Expedientes Legales</div>
    </div>
    
    <!-- Formulario -->
    <div class="login-card-body">
        <h2 class="login-title">
            <i class="bi bi-shield-lock-fill"></i>
            Acceso al Sistema
        </h2>
        
        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person-fill text-primary"></i>
                    Usuario
                </label>
                <input type="text" class="form-control" id="username" name="username" 
                       placeholder="Ingrese su usuario" required autofocus>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="bi bi-lock-fill text-warning"></i>
                    Contraseña
                </label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="Ingrese su contraseña" required>
            </div>
            
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label text-muted" for="remember">Recordar sesión</label>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i>
                Ingresar
            </button>
        </form>
    </div>
</div>
{% endblock %}
